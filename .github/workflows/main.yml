name: Deploy tienda Importa-Ya

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: importa-ya
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: importa-ya/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_EPAYCO_PUBLIC_KEY: ${{ secrets.VITE_EPAYCO_PUBLIC_KEY }}
          VITE_EPAYCO_TEST: "false"
          VITE_SUPABASE_URL: ${{ 'https://ttslhayuavksvgtfimfa.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ 'sb_publishable_29sCKX2IkGSsmbskgA3xpg_NH3OfrUK' }}
        run: npm run build

      - name: Preparar rutas de React Router
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: importa-ya/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
